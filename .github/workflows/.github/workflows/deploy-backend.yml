name: Deploy backend (Supabase functions)
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
      SETUP_SECRET: ${{ secrets.SETUP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Set function secrets
        run: supabase secrets set APP_JWT_SECRET="$APP_JWT_SECRET" SETUP_SECRET="$SETUP_SECRET" --project-ref "$PROJECT_REF"
      - name: Deploy functions
        run: supabase functions deploy login register session admin bootstrap-admin --no-verify-jwt --project-ref "$PROJECT_REF"
